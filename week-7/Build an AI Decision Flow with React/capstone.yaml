run: "uvicorn app.main:app --reload --port 8000"
seed: "python seed.py"
test: "pytest -q"
base_url: "http://localhost:8000"
endpoints:
  - "POST /widgets"
  - "GET /widgets"
  - "PATCH /widgets/{id}"
  - "DELETE /widgets/{id}"
  - "GET /widgets/{id}/config"
  - "GET /widget.v1.js?id={id}"
  - "POST /submissions?widget_id={id}"
  - "GET /dashboard/submissions"
  - "GET /dashboard/stats"
