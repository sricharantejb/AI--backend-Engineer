services:
  postgres:
    image: postgres
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: flask-app
    ports:
      - "5001:5000"
    depends_on:
      - postgres